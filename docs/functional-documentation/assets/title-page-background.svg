<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">

  <!-- Header above the title -->
  <line x1="80" y1="330" x2="515" y2="330" stroke="#9d9d9d" stroke-width="0.5"/>

  <!-- Text below the title -->
  <line x1="80" y1="525" x2="515" y2="525" stroke="#9d9d9d" stroke-width="0.5"/>

  <!-- Warning message -->
  <g transform="translate(95,565)">

    <!-- Small warning triangle -->
    <polygon points="10,0 20,18 0,18"
             fill="#FFD700"
             stroke="#C9A400"
             stroke-width="0.8"/>

    <!-- Exclamation mark -->
    <line x1="10" y1="5" x2="10" y2="12"
          stroke="#000000"
          stroke-width="1.2"
          stroke-linecap="round"/>
    <circle cx="10" cy="15" r="0.8" fill="#000000"/>

    <!-- Warning text -->
    <text x="30" y="13"
          font-family="Montserrat, Helvetica, sans-serif"
          font-size="9"
          font-weight="bold"
          font-style="italic"
          fill="#C00000">
      Warning. The present document cancels and replaces the previous release.
    </text>
  </g>

</svg>
