[versions]
# The Project version represents the snapshot version and must never be modified,
# as it is the release tag that indicates the release version.
project = "99.99.99"
# Dependencies versions
agp = "9.4.1"
androidxActivity = "1.10.1"
androidxActivityCompose = "1.10.1"
androidxAppcompat = "1.7.1"
androidxConstraintLayout = "2.2.1"
androidxCore = "1.16.0"
androidxDatastorePreferences = "1.1.7"
androidxFragment = "1.8.8"
# Lifecycle 2.11+ requires compileSdk 37
androidxLifecycleViewmodel = "2.10.0"
androidxNavigationCompose = "2.9.2"
assertj = "3.25.3"
bitLib4j = "1.4.5"
# Compottie 2.3.0+ requires Kotlin 2.4
compottie = "2.2.4"
composeBom = "2025.08.01"
# Compose Multiplatform plugin and libraries (1.11 requires Kotlin 2.3 for iOS)
composePlugin = "1.11.1"
# Compose Multiplatform Material 3 (versioned separately)
composeMaterial3 = "1.9.0"
coroutines = "1.10.2"
gson = "2.11.0"
hilt = "2.60.1"
keypleJavaBom = "2026.09.29"
keyplePluginCnaFamocoSeCommunicationLib = "2.0.2"
kotlin = "2.3.21"
# KSP 2.3.1+ supports the Kotlin built into AGP 9 (the KSP versions no longer follow the Kotlin ones)
ksp = "2.3.12"
kotlinxSerializationCore = "1.9.0"
ktor = "3.2.3"
lottie = "6.7.1"
material = "1.12.0"
napier = "2.7.1"
# Same version as the OkHttp library used by Retrofit
okhttpLogging = "3.14.9"
quarkus = "3.40.1"
retrofit = "2.11.0"
retrofitCompat = "2.11.0"
# Last 1.7 version: the slf4j-timber binding of the Android apps does not support SLF4J 2
slf4j = "1.7.36"
slf4jTimber = "3.1"
spotless = "7.0.4"
timber = "5.0.1"

[libraries]
androidxActivity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidxAppcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
