androidxFragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidxLifecycleViewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycleViewmodel" }
androidxNavigationCompose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidxNavigationCompose" }
assertjCore = { module = "org.assertj:assertj-core", version.ref = "assertj" }
bitLib4j = { module = "com.github.devnied:bit-lib4j", version.ref = "bitLib4j" }
