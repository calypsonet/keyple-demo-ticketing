name: Reusable AsciiDoc Release

on:
  workflow_call:
    inputs:
      component-name:
        description: 'Name of the document being built'
        required: true
        type: string
      working-directory:
        description: 'Directory of the AsciiDoc document'
        required: true
        type: string
      document:
        description: 'AsciiDoc document to build, relative to the working directory'
        required: true
        type: string

jobs:
  release-asciidoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Same toolchain as the CNA specifications (calypsonet-actions): Asciidoctor, Asciidoctor PDF, and Asciidoctor
    # Diagram (PlantUML)
    container:
      image: asciidoctor/docker-asciidoctor:latest

    steps:
      - name: Check out repository code from ${{ github.repository }}/${{ github.ref }}
        uses: actions/checkout@v5

      - name: Generate the PDF and standalone HTML of ${{ inputs.component-name }}
        id: document
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Version of the edition: the release tag (YY.MM.DD), its date being the date of the edition (stable when
          # the job is run again); the document reference of the header is fixed
          version="${{ github.event.release.tag_name || github.ref_name }}"
          if ! echo "$version" | grep -Eq '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::The workflow must be run on a release tag in the YY.MM.DD format (not '$version')"
            exit 1
          fi
          release_date=$(echo "$version" | sed -E 's/^([0-9]{2})\.([0-9]{2})\.([0-9]{2})$/20\1-\2-\3/')
          # Name of the attached files: the document reference of the header, followed by the version (for example,
          # 261022-FD-KeypleDemoTicketing_v26.10.22)
          doc_ref=$(sed -n -E 's/^:doc-ref:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "${{ inputs.document }}")
          if [ -z "$doc_ref" ]; then
            echo "::error::No :doc-ref: attribute found in ${{ inputs.document }}"
            exit 1
          fi
          name="${doc_ref}_v${version}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for converter in asciidoctor asciidoctor-pdf; do
            "$converter" -r asciidoctor-diagram -a revnumber="$version" -a revdate="$release_date" \
              -D generated "${{ inputs.document }}"
          done
          base="generated/$(basename "${{ inputs.document }}" .adoc)"
          output="generated/$name"
          mv "$base.html" "$output.html"
          mv "$base.pdf" "$output.pdf"

      - name: Upload ${{ inputs.component-name }} to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ inputs.working-directory }}/generated/${{ steps.document.outputs.name }}.pdf
            ${{ inputs.working-directory }}/generated/${{ steps.document.outputs.name }}.html
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that ${{ steps.document.outputs.version }} is the latest release
        id: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.document.outputs.version }}
        run: |
          # An older release run again must not replace the documentation of the latest release. No gh CLI nor jq in
          # the container: the GitHub API is called with curl, and its JSON read with Ruby
          latest=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("tag_name")')
          if [ "$VERSION" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages not updated: $VERSION is not the latest release ($latest)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the gh-pages branch
        if: steps.latest.outputs.publish == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish ${{ inputs.component-name }} ${{ steps.document.outputs.version }} to GitHub Pages
        if: steps.latest.outputs.publish == 'true'
        working-directory: gh-pages
        env:
          HTML: ${{ github.workspace }}/${{ inputs.working-directory }}/generated/${{ steps.document.outputs.name }}.html
          VERSION: ${{ steps.document.outputs.version }}
        run: |
          git config --global --add safe.directory "$PWD"
          cp "$HTML" index.html
          # Files served as they are, without Jekyll processing
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "::notice::GitHub Pages already up to date with $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish the functional documentation $VERSION"
          git push origin gh-pages
