name: Reusable AsciiDoc Release

on:
  workflow_call:
    inputs:
      component-name:
        description: 'Name of the document being built'
        required: true
        type: string
      working-directory:
        description: 'Directory of the AsciiDoc document'
        required: true
        type: string
      document:
        description: 'AsciiDoc document to build, relative to the working directory'
        required: true
        type: string
      archive-name-prefix:
        description: 'Prefix of the names of the PDF and HTML files attached to the release'
        required: true
        type: string

jobs:
  release-asciidoc:
    runs-on: ubuntu-latest

    # Same toolchain as the CNA specifications (calypsonet-actions): Asciidoctor, Asciidoctor PDF, and Asciidoctor
    # Diagram (PlantUML)
    container:
      image: asciidoctor/docker-asciidoctor:latest

    steps:
      - name: Check out repository code from ${{ github.repository }}/${{ github.ref }}
        uses: actions/checkout@v5

      - name: Generate the PDF and standalone HTML of ${{ inputs.component-name }}
        id: document
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Version of the edition: the release tag (YY.MM.DD), its date being the date of the edition (stable when
          # the job is run again); the document reference of the header is fixed
          version="${{ github.event.release.tag_name || github.ref_name }}"
          if ! echo "$version" | grep -Eq '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::The workflow must be run on a release tag in the YY.MM.DD format (not '$version')"
            exit 1
          fi
          release_date=$(echo "$version" | sed -E 's/^([0-9]{2})\.([0-9]{2})\.([0-9]{2})$/20\1-\2-\3/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for converter in asciidoctor asciidoctor-pdf; do
            "$converter" -r asciidoctor-diagram -a revnumber="$version" -a revdate="$release_date" \
              -D generated "${{ inputs.document }}"
          done
          base="generated/$(basename "${{ inputs.document }}" .adoc)"
          output="generated/${{ inputs.archive-name-prefix }}-${version}"
          mv "$base.html" "$output.html"
          mv "$base.pdf" "$output.pdf"

      - name: Upload ${{ inputs.component-name }} to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ inputs.working-directory }}/generated/${{ inputs.archive-name-prefix }}-${{ steps.document.outputs.version }}.pdf
            ${{ inputs.working-directory }}/generated/${{ inputs.archive-name-prefix }}-${{ steps.document.outputs.version }}.html
          token: ${{ secrets.GITHUB_TOKEN }}
