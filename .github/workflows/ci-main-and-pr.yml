name: CI on main and PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================
  # ANDROID APPLICATIONS
  # ========================================

  ci-control:
    name: "Control (Android)"
    uses: ./.github/workflows/reusable-android-ci.yml
    with:
      component-name: "Control"
      working-directory: "./src/control/"

  ci-reloading-kmp-android-macos:
    name: "Reload Interop (KMP, Android/macOS)"
    uses: ./.github/workflows/reusable-android-ci.yml
    with:
      component-name: "Reloading Client Interop Mobile Multiplatform"
      working-directory: "./src/reloading-remote/client/interop-mobile-multiplatform/"
      target-os: "macos-latest"
      # The layering rules apply to the Android applications: the multiplatform client follows the MVVM pattern, its
      # view models calling the data services directly
      check-architecture: false

  ci-reloading-android:
    name: "Reload (Android)"
    uses: ./.github/workflows/reusable-android-ci.yml
    with:
      component-name: "Reloading Client Keyple Mobile Android"
      working-directory: "./src/reloading-remote/client/keyple-mobile-android/"

  ci-validation:
    name: "Validation (Android)"
    uses: ./.github/workflows/reusable-android-ci.yml
    with:
      component-name: "Validation"
      working-directory: "./src/validation/"

  check-android-twin-files:
    name: "Twin files (Android)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code from ${{ github.repository }}/${{ github.ref }}
        uses: actions/checkout@v5

      - name: Check the twin files of the Android applications
        shell: bash
        run: bash .github/scripts/check-android-twin-files.sh

  # ========================================
  # LOG AND EXCEPTION MESSAGES OF ALL THE COMPONENTS
  # ========================================

  check-messages:
    name: "Log and exception messages (all components)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code from ${{ github.repository }}/${{ github.ref }}
        uses: actions/checkout@v5

      - name: Check the log and exception messages against the conventions of the README
        shell: bash
        run: python3 .github/scripts/check-messages.py

  # ========================================
  # SERVER APPLICATION
  # ========================================

  ci-reloading-server:
    name: "Reload Server (Java+Node)"
    uses: ./.github/workflows/reusable-java-node-ci.yml
    with:
      component-name: "Reloading Server"
      working-directory: "./src/reloading-remote/server/"
      node-directory: "./dashboard-app"

  # ========================================
  # iOS FRAMEWORKS - MULTIPLATFORM
  # ========================================

  ci-reloading-kmp-ios-arm64:
    name: "Reload Interop (KMP, iOS-Arm64/macOS)"
    uses: ./.github/workflows/reusable-kmp-ios-ci.yml
    with:
      component-name: "Reloading Client Interop Mobile Multiplatform"
      working-directory: "./src/reloading-remote/client/interop-mobile-multiplatform/"
      gradle-task: "linkDebugFrameworkIosArm64"

  ci-reloading-kmp-ios-simulator-arm64:
    name: "Reload Interop (KMP, iOS-SimulatorArm64/macOS)"
    uses: ./.github/workflows/reusable-kmp-ios-ci.yml
    with:
      component-name: "Reloading Client Interop Mobile Multiplatform"
      working-directory: "./src/reloading-remote/client/interop-mobile-multiplatform/"
      gradle-task: "linkDebugFrameworkIosSimulatorArm64"

  # ========================================
  # .NET APPLICATIONS
  # ========================================

  ci-reloading-dotnet:
    name: "Reload (.NET/Windows)"
    uses: ./.github/workflows/reusable-dotnet-ci.yml
    with:
      component-name: "Reloading Client PC .NET"
      working-directory: "./src/reloading-remote/client/pc-dotnet/"

  # ========================================
  # DOCUMENTATION
  # ========================================

  ci-functional-documentation:
    name: "Functional documentation (PDF, HTML)"
    uses: ./.github/workflows/reusable-asciidoc-ci.yml
    with:
      component-name: "Functional documentation"
      working-directory: "./docs/functional-documentation/"
      document: "index.adoc"