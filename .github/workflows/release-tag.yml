name: Release tag

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  # ========================================
  # ANDROID APPLICATIONS
  # ========================================

  release-inspection:
    name: "Inspection (Android)"
    uses: ./.github/workflows/reusable-android-release.yml
    with:
      component-name: "Inspection"
      working-directory: "./src/inspection/"

  release-sales-kmp-android:
    name: "Sales Interop (KMP, Android)"
    uses: ./.github/workflows/reusable-android-release.yml
    with:
      component-name: "Sales Client Interop Mobile Multiplatform"
      working-directory: "./src/sales/client/interop-mobile-multiplatform/"
      apk-output-path: "androidApp/build/outputs/apk/debug/*.apk"

  release-sales-android:
    name: "Sales (Android)"
    uses: ./.github/workflows/reusable-android-release.yml
    with:
      component-name: "Sales Client Keyple Mobile Android"
      working-directory: "./src/sales/client/keyple-mobile-android/"

  release-validation:
    name: "Validation (Android)"
    uses: ./.github/workflows/reusable-android-release.yml
    with:
      component-name: "Validation"
      working-directory: "./src/validation/"

  # ========================================
  # SERVER APPLICATION
  # ========================================

  release-sales-server:
    name: "Sales Server (Java+Node)"
    uses: ./.github/workflows/reusable-java-node-release.yml
    with:
      component-name: "Sales Server"
      working-directory: "./src/sales/server/"
      node-directory: "./dashboard-app"

  # ========================================
  # DESKTOP APPLICATIONS - MULTIPLATFORM
  # ========================================

  release-sales-kmp-macos:
    name: "Sales Interop (KMP, macOS)"
    uses: ./.github/workflows/reusable-kmp-desktop-release.yml
    with:
      component-name: "Sales Client Interop Mobile Multiplatform"
      target-os: "macos-latest"
      platform-name: "macOS"
      working-directory: "./src/sales/client/interop-mobile-multiplatform/"
      platform-artifact-pattern: "composeApp/build/compose/binaries/main/dmg/*.dmg"

  release-sales-kmp-linux:
    name: "Sales Interop (KMP, Linux)"
    uses: ./.github/workflows/reusable-kmp-desktop-release.yml
    with:
      component-name: "Sales Client Interop Mobile Multiplatform"
      target-os: "ubuntu-latest"
      platform-name: "Linux"
      working-directory: "./src/sales/client/interop-mobile-multiplatform/"
      platform-artifact-pattern: "composeApp/build/compose/binaries/main/deb/*.deb"

  release-sales-kmp-windows:
    name: "Sales Interop (KMP, Windows)"
    uses: ./.github/workflows/reusable-kmp-desktop-release.yml
    with:
      component-name: "Sales Client Interop Mobile Multiplatform"
      target-os: "windows-latest"
      platform-name: "Windows"
      working-directory: "./src/sales/client/interop-mobile-multiplatform/"
      platform-artifact-pattern: "composeApp/build/compose/binaries/main/msi/*.msi"

  # ========================================
  # .NET APPLICATIONS
  # ========================================

  release-sales-dotnet:
    name: "Sales (.NET/Windows)"
    uses: ./.github/workflows/reusable-dotnet-release.yml
    with:
      component-name: "Sales Client PC .NET"
      working-directory: "./src/sales/client/pc-dotnet/"
      archive-name-prefix: "kdt-sales-pc-dotnet-app"

  # ========================================
  # DOCUMENTATION
  # ========================================

  release-functional-documentation:
    name: "Functional documentation (PDF, HTML)"
    uses: ./.github/workflows/reusable-asciidoc-release.yml
    with:
      component-name: "Functional documentation"
      working-directory: "./docs/functional-documentation/"
      document: "index.adoc"
      archive-name-prefix: "kdt-functional-documentation"