name: Reusable KMP Desktop Release

on:
  workflow_call:
    inputs:
      component-name:
        description: 'Name of the component being built'
        required: true
        type: string
      target-os:
        description: 'Target OS (ubuntu-latest, macos-latest, windows-latest)'
        required: true
        type: string
      working-directory:
        description: 'Working directory for the build'
        required: true
        type: string
      platform-artifact-pattern:
        description: 'Artifact pattern specific to the platform'
        required: true
        type: string

jobs:
  release-kmp-desktop:
    runs-on: ${{ inputs.target-os }}
    steps:
      - name: Check out repository code from ${{ github.repository }}/${{ github.ref }}
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update permissions for ${{ inputs.component-name }} (${{ runner.os }})
        working-directory: .
        run: chmod +x ${{ inputs.working-directory }}/gradlew

      - name: Build ${{ inputs.component-name }}       artifacts for ${{ runner.os }}
        env:
          ORG_GRADLE_PROJECT_releaseTag: ${{ github.event.release.tag_name }}
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew packageDistributionForCurrentOS packageUberJarForCurrentOS

      - name: Upload ${{ inputs.component-name }} artifacts for ${{ runner.os }} to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ inputs.working-directory }}/${{ inputs.platform-artifact-pattern }}
            ${{ inputs.working-directory }}/composeApp/build/compose/jars/*.jar
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}