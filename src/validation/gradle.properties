# Project configuration
group = org.calypsonet.keyple

# Java Configuration
# The bytecode is converted by the Android build (D8) for the minimum SDK: the Java version has no
# impact on the devices, unlike the Java APIs used, checked by Android Lint for the minimum SDK.
javaSourceLevel = 17
javaTargetLevel = 17

# Ensure Gradle JVM uses UTF-8 encoding for consistent file reading/writing across all environments
org.gradle.jvmargs = -Dfile.encoding=UTF-8

# Android Configuration (custom properties)
androidAppNamespace = org.calypsonet.keyple.demo.validation
androidAppId = org.calypsonet.keyple.demo.validation
androidAppVersionCode = 1
androidAppVersionName = 1.0
androidCompileSdk = 35
androidTargetSdk = 35
androidMinSdk = 26

# Android Project Configuration (global properties)
# Kotlin code style for this project ("official" or "obsolete"): use the official Kotlin coding conventions
kotlin.code.style=official
# Use AndroidX libraries instead of legacy Android Support libraries (required for modern Android)
android.useAndroidX=true
# Automatically convert third-party libraries using old support libraries to AndroidX (may slow builds).
# Required by the Coppernic plugin (CpcAsk SDK using the legacy constraint-layout):
# run "./gradlew checkJetifier" to check whether it can be disabled.
android.enableJetifier=true
