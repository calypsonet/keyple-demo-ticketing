# Project configuration
group = org.calypsonet.keyple

# Java Configuration
jvmToolchainVersion = 17
javaSourceLevel = 17
javaTargetLevel = 17

# Ensure Gradle JVM uses UTF-8 encoding for consistent file reading/writing across all environments
org.gradle.jvmargs = -Dfile.encoding=UTF-8 -Xmx4g

# Android Configuration (custom properties)
androidAppNamespace = org.calypsonet.keyple.demo.reload.remote
androidAppId = org.calypsonet.keyple.demo.reload.remote.interop
androidAppVersionCode = 1
androidAppVersionName = 1.0
androidCompileSdk = 35
androidTargetSdk = 35
androidMinSdk = 26

# Android Project Configuration (global properties)
# Kotlin code style for this project ("official" or "obsolete"): use the official Kotlin coding conventions
kotlin.code.style=official
# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
# Use AndroidX libraries instead of legacy Android Support libraries (required for modern Android)
android.useAndroidX=true
# No conversion of third-party libraries using old support libraries to AndroidX (Jetifier): no library
# requires it ("./gradlew checkJetifier").
android.enableJetifier=false
