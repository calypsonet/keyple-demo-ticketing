#allow Cross-origin resource sharing
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/

#create a uber jar
quarkus.package.jar.type=uber-jar
quarkus.package.runner-suffix=-full

#do not cache the dashboard entry page, which references assets whose names change at each build
#(the assets themselves remain cached)
quarkus.http.filter.dashboard-index.matches=/(index\\.html)?
quarkus.http.filter.dashboard-index.header."Cache-Control"=no-cache

#manage log level
quarkus.log.level=INFO
quarkus.log.category."org.calypsonet.keyple".level=INFO
quarkus.log.category."org.eclipse.keyple".level=INFO

#regex filter to search the sam reader
sam.pcsc.reader.filter=.*(Cherry TC|SCM Microsystems|Identive|HID|Generic).*